# Forbid destructive GitHub CLI (gh) operations and ask for confirmation.
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "gh pr merge",
  "gh release delete",
  "gh repo delete",
  "gh secret delete",
]
decision = "deny"
priority = 900

# Deny heredoc usage
[[rule]]
toolName = "run_shell_command"
commandRegex = ".*<<\\s*['\"]?[a-zA-Z0-9_]+['\"]?"
decision = "deny"
priority = 900
deny_message = "Using heredocs (e.g. 'cat << EOF') is prohibited in the shell. Please use the native 'write_file' tool instead."

# Catch destructive or mutating Git operations and ask for confirmation.
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "git branch -D",
  "git cherry-pick",
  "git clean",
  "git commit",
  "git filter-branch",
  "git filter-repo",
  "git merge",
  "git push",
  "git rebase",
  "git reset",
  "git rm",
  "git stash",
]
decision = "ask_user"
priority = 500

# Catch any redirections (>, <) or command chaining (;, &, ||) and require manual approval.
[[rule]]
toolName = "run_shell_command"
argsPattern = '.*([<>;&]|\|\|).*'
decision = "ask_user"
priority = 500

# Auto-approve safe read-only standard shell commands.
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "awk",
  "cat",
  "date",
  "echo",
  "find",
  "grep",
  "head",
  "hostname",
  "ls",
  "man",
  "pwd",
  "rg",
  "sort",
  "stat",
  "tail",
  "tree",
  "uname",
  "uniq",
  "wc",
  "which",
]
decision = "allow"
priority = 100
allow_redirection = true

# Auto-approve xargs with safe read-only standard shell commands.
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "xargs awk",
  "xargs cat",
  "xargs grep",
  "xargs head",
  "xargs sort",
  "xargs stat",
  "xargs tail",
  "xargs uniq",
  "xargs wc",
  "xargs which",
]
decision = "allow"
priority = 100
allow_redirection = true

# Auto-approve safe read-only usages of sed.
[[rule]]
toolName = "run_shell_command"
# Line number filtering
commandRegex = '''sed[ Ern-]*'[0-9]+,?[0-9$]*p'(| [a-zA-Z0-9_./][a-zA-Z0-9_./-]*)'''
decision = "allow"
priority = 100
allow_redirection = true
[[rule]]
toolName = "run_shell_command"
# Safe subset of string processing
commandRegex = '''sed[ Ern-]*'s/[^/']*/[^/']*/[gpI]*'(| [a-zA-Z0-9_./][a-zA-Z0-9_./-]*)'''
decision = "allow"
priority = 100
allow_redirection = true

# Auto-approve safe write shell commands.
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
	"mkdir",
]
decision = "allow"
priority = 100

# Auto-approve safe read-only Version Control & GitHub inspection.
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  # git
  "git diff",
  "git log",
  "git remote",
  "git show",
  "git status",
  
  # hg
  "hg diff",
  "hg log",
  "hg status",
  
  # jj
  "jj diff",
  "jj log",
  "jj status",
  
  # gh
  "gh api",
  "gh auth status",
  "gh issue view",
  "gh pr checks",
  "gh pr diff",
  "gh pr view",
]
decision = "allow"
priority = 100
allow_redirection = true

