[env]

path = [
    "$HOME/bin",
    "$GOPATH/bin",
    "$HOME/.local/bin",
    "$HOME/.config/git/bin",
    "$TCONF/bin",
    "$TCONF/priv/bin",
]

[env.vars]

TCONF = "$HOME/tconf"

BROWSER = "google-chrome"
GITHUB_USER = "tallclair"
GOPATH = "$HOME/go"
KUBECONFIG = "$HOME/.kube/config"

[env.aliases]
# These must remain true aliases (functions in Fish) because of pipes/redirection/semicolons
uuid = "cat /dev/urandom | tr -dc a-z0-9 | head -c 32; echo"
xcp = "xclip -selection clipboard"

[env.abbreviations]
# Kubernetes
k8s-run-e2e = "make WHAT=test/e2e/e2e.test && KUBERNETES_CONFORMANCE_TEST=y hack/ginkgo-e2e.sh --ginkgo.focus"
kind-test-e2e = "ginkgo --focus=\"$FOCUS\" ./test/e2e -- -context kind-kind -num-nodes 2"
kind-create-e2e-cluster = "kind create cluster --config $HOME/src/github.com/tallclair/k8s-devel/config/kind-e2e-config.yaml --image kindest/node:latest"
kind-rebuild-e2e-cluster = "kind delete cluster && kind build node-image && kind create cluster --config $HOME/src/github.com/tallclair/k8s-devel/config/kind-e2e-config.yaml --image kindest/node:latest"

# K8s deploy environment
k8s-env = "echo $K8S_ENV; or echo default"
k8s-env-small = "source $HOME/k8s/devel/config/config-small.sh && k8s-env"

# Graphs
graph-png = "dot -Tpng -o /tmp/graph.png && google-chrome /tmp/graph.png"
graph-svg = "dot -Tsvg -o /tmp/graph.svg && google-chrome /tmp/graph.svg"

# Common typos (maintained as abbreviations for auto-correction)
gits = "git status"
jjs = "jj status"
kubcetl = "kubectl"
kuebctl = "kubectl"
